[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-physics",
    "crates/engine-script",
    "crates/engine-audio",
    "crates/engine-input",
    "crates/engine-ai",
    "crates/engine-assets",
    "crates/engine-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["salom600"]
repository = "https://github.com/salom600/Enginebeta"
description = "EngineBeta — a modern, lean Rust game engine (Windows + Linux)"
keywords = ["game-engine", "rust", "wgpu", "cross-platform"]
categories = ["game-engines"]

[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.18", features = ["derive"] }
# Logging
log = "0.4"
env_logger = "0.11"
# Concurrency / utils
parking_lot = "0.12"
crossbeam-channel = "0.5"
anyhow = "1.0"
thiserror = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
# Graphics / windowing
wgpu = "22.1"
winit = "0.30"
# Audio
rodio = "0.20"
# Input
gilrs = "0.11"
# Async runtime (for wgpu init)
pollster = "0.3"
# Internal crates
engine-core     = { path = "crates/engine-core" }
engine-render   = { path = "crates/engine-render" }
engine-physics  = { path = "crates/engine-physics" }
engine-script   = { path = "crates/engine-script" }
engine-audio    = { path = "crates/engine-audio" }
engine-input    = { path = "crates/engine-input" }
engine-ai       = { path = "crates/engine-ai" }
engine-assets   = { path = "crates/engine-assets" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
