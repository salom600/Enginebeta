# Build EngineBeta on every push and PR, produce Windows + Linux binaries,
# and upload them as workflow artifacts. Tag pushes also create a GitHub Release.
#
# This workflow is the "track build results on GitHub Actions" pipeline requested
# in the project brief: every push triggers a fresh build on both Windows and
# Linux, and any failure is visible in the Actions tab. Artifacts are kept for
# 90 days so you can download the exact binary from any commit.

name: Build EngineBeta

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # edition2024 (used by hashbrown 0.17+) requires Rust 1.85+.
  RUST_TOOLCHAIN: '1.85.0'

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: enginebeta-linux-x86_64
            binary_name: enginebeta
            asset_suffix: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: enginebeta-windows-x86_64
            binary_name: enginebeta.exe
            asset_suffix: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: '.'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libudev-dev \
            libxcb1-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl-dev \
            libxcb-randr0-dev libxcb-xinput-dev libxcb-xkb-dev \
            libxcb-shape0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libx11-xcb-dev libxcursor-dev libxinerama-dev

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p engine-launcher

      - name: Run tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} \
             artifacts/enginebeta-${{ matrix.asset_suffix }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish Release (on tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
